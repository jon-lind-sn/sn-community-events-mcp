[project]
name = "sn-community-events-mcp"
version = "0.1.0"
description = "MCP server exposing ServiceNow Community events (SNUGs, webinars, World Forum, etc.) as a queryable tool"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==1.9.4",
]

[project.scripts]
sn-community-events-mcp = "sn_community_events_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
